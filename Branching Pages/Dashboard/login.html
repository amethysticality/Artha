<div class="header"style="height:clamp(20px, 20vw, 100px); border-top-left-radius: 10px;border-top-right-radius: 10px; color: #353535; background-color: #353535; opacity: 50%; visibility: visible;"></div>
</div>
<div class="main">
    <style>
        .container {
            display: grid; /* Enables CSS Grid layout */
            /* Creates two columns, each taking up 1 fractional unit (1fr), resulting in a 50%/50% split. */
            grid-template-columns: 1fr 1fr;
            width: 100%;
            background-color: inherit;
            text-align: center;
        }
        
        .left-side, .right-side {
            background-color: inherit;
            flex-grow: 1; /* Tells both elements to grow and take up an equal fraction of the space */
            /* You can remove any fixed 'width: 50%;' if you had one, as 'flex-grow: 1' handles it */
        }
        .button {
            font-family: 'Engravers MT', 'Garamond', serif;
        }
        .jamais {
            filter: blur(5px);
        }
        .jamais:hover {
            filter: blur(0px);
            transition: filter 0.5s ease-in-out;
        }
        .jamais a:hover {
            color: olivedrab;
            transition: filter 0.5s ease-in-out;
        }
        </style>
        <div class="container">
    <div style="background-color: rgb(20, 20, 20); padding: 20px; margin: 10px; border-radius: 10px;" class="left-side">
        <h2>Login</h2>
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <button type="button" onclick="handleLogin()">Login</button>
</form>

    </div>
    <div class="jamais" style="background-image: url('/ImagesAndVisualAssets/Images/Hubble_ultra_deep_field.jpg'); backdrop-filter: blur(5px); background-attachment: 0.5; padding: 20px; margin: 10px; border-radius: 10px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; text-align: left;" class="right-side">
        <div style=" color: white; padding: 0%; margin: 0%;">
        <h1 style="font-size: clamp(50px,2vw,70px);">Don't Have an Account With Us?</h1>
        <a href="register.html" style="text-decoration: underline;"><i>Go to Registration ↗</i></a>

    </div>
    </div>
</div>
